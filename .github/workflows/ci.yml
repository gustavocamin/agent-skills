name: CI
on:
  push:
  pull_request:
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash -n install.sh scripts/sincronizar.sh
      - run: python3 scripts/conferir.py
